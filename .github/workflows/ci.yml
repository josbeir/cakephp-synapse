name: CI

on:
  push:
    branches: [ 'main', 'cake6' ]
  pull_request:
    branches: [ main, cake6 ]

env:
  PHP_EXTENSIONS: intl, sqlite3, fileinfo, pdo_sqlite

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        php-version: ['8.5']
        prefer-lowest: ['']
        include:
          - php-version: '8.5'
            os: ubuntu-latest
            prefer-lowest: 'prefer-lowest'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          if ${{ matrix.prefer-lowest == 'prefer-lowest' }}; then
            composer require --dev --no-update dereuromark/composer-prefer-lowest:dev-master
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
          else
            composer install --prefer-dist --no-interaction --no-progress
          fi

      - name: Run PHPUnit
        shell: bash
        run: |
          if [[ '${{ matrix.prefer-lowest }}' == '' && ${{ matrix.os }} == 'ubuntu-latest' ]]; then
            vendor/bin/phpunit --coverage-clover=coverage.xml --log-junit junit.xml
          else
            vendor/bin/phpunit --log-junit junit.xml
          fi

      - name: Validate prefer-lowest
        if: matrix.prefer-lowest == 'prefer-lowest'
        run: vendor/bin/validate-prefer-lowest -m

      - name: Upload coverage reports to Codecov
        if: success() && matrix.prefer-lowest == '' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  static-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: ${{ env.PHP_EXTENSIONS }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Run PHPCS
        run: vendor/bin/phpcs

      - name: Run Rector
        run: vendor/bin/rector process --dry-run
